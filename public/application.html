<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now | E-Adem Global</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a',
                        accent: '#3b82f6',
                        success: '#10b981',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>* { font-family: 'Inter', sans-serif; }</style>
    <script>
        fetch('/api/user').then(r => { if (!r.ok) window.location.href = 'login.html'; }).catch(() => window.location.href = 'login.html');
    </script>
</head>
<body class="min-h-screen bg-slate-50">
    <!-- Header -->
    <header class="fixed w-full top-0 z-50 bg-primary/95 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="dashboard.html" class="flex items-center gap-3">
                    <img src="./images/logo.png" alt="E-Adem" class="h-12 w-auto brightness-0 invert">
                </a>
                <a href="dashboard.html" class="px-5 py-2.5 bg-accent hover:bg-blue-600 text-white rounded-lg text-sm font-semibold transition-all">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Dashboard
                </a>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="relative h-[40vh] flex items-center pt-20 bg-gradient-to-br from-primary via-secondary to-primary">
        <div class="absolute inset-0 opacity-30">
            <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-500/30 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl"></div>
        </div>
        <div class="relative max-w-7xl mx-auto px-4 text-center">
            <h1 class="text-4xl sm:text-5xl font-bold text-white mb-4">Start Your Journey</h1>
            <p class="text-white/80 text-lg">Apply for Loans, Investments, or Training today</p>
        </div>
    </section>

    <!-- Application Form -->
    <section class="py-16 bg-slate-50">
        <div class="max-w-2xl mx-auto px-4">
            <div class="bg-white rounded-2xl shadow-lg border-t-4 border-accent overflow-hidden">
                <form id="unified-application-form" class="p-8">
                    <!-- Step 1: Service Type -->
                    <div class="mb-8 pb-8 border-b border-gray-100">
                        <h3 class="text-lg font-bold text-primary mb-6">1. What are you interested in?</h3>
                        <div class="grid grid-cols-3 gap-4">
                            <div class="type-option active cursor-pointer text-center p-4 border-2 border-accent bg-accent text-white rounded-xl" data-value="Loan">
                                <i class="fas fa-hand-holding-usd text-2xl mb-2 block"></i>
                                <strong>Loan</strong>
                            </div>
                            <div class="type-option cursor-pointer text-center p-4 border-2 border-gray-200 rounded-xl hover:border-accent hover:bg-slate-50 transition-all" data-value="Investment">
                                <i class="fas fa-piggy-bank text-2xl mb-2 block text-gray-600"></i>
                                <strong class="text-gray-600">Investment</strong>
                            </div>
                            <div class="type-option cursor-pointer text-center p-4 border-2 border-gray-200 rounded-xl hover:border-accent hover:bg-slate-50 transition-all" data-value="Forex">
                                <i class="fas fa-chart-line text-2xl mb-2 block text-gray-600"></i>
                                <strong class="text-gray-600">Forex</strong>
                            </div>
                        </div>
                        <input type="hidden" id="application-type" name="type" value="Loan">
                    </div>

                    <!-- Step 2: Personal Info -->
                    <div class="mb-8 pb-8 border-b border-gray-100">
                        <h3 class="text-lg font-bold text-primary mb-6">2. Personal Information</h3>
                        <div class="grid md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Full Name *</label>
                                <input type="text" name="fullName" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="Your full name">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Email Address *</label>
                                <input type="email" name="email" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="your@email.com">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number *</label>
                            <input type="tel" name="phone" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="+234 xxx xxx xxxx">
                        </div>
                    </div>

                    <!-- Step 3: Specific Details -->
                    <div class="mb-8">
                        <h3 class="text-lg font-bold text-primary mb-6">3. Specific Details</h3>
                        
                        <!-- Loan Fields -->
                        <div id="fields-Loan" class="dynamic-fields">
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Loan Amount (₦) *</label>
                                <input type="number" name="loanAmount" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="e.g. 50000">
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Repayment Duration *</label>
                                <select name="loanDuration" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent bg-white">
                                    <option value="1 Month">1 Month</option>
                                    <option value="3 Months">3 Months</option>
                                    <option value="6 Months">6 Months</option>
                                    <option value="1 Year">1 Year</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Purpose of Loan</label>
                                <textarea name="loanPurpose" rows="3" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent resize-none" placeholder="Briefly describe what you need the loan for..."></textarea>
                            </div>
                            <div class="mb-6 p-4 bg-gray-50 rounded-xl border border-gray-200">
                                <h4 class="font-semibold text-gray-800 mb-4">Guarantor Information</h4>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Guarantor Full Name *</label>
                                        <input type="text" name="guarantorName" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="Guarantor's Full Name">
                                    </div>
                                    <div class="grid md:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-2">Guarantor Phone *</label>
                                            <input type="tel" name="guarantorPhone" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="Guarantor's Phone">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-2">Guarantor Email</label>
                                            <input type="email" name="guarantorEmail" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="Guarantor's Email">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Relationship *</label>
                                        <input type="text" name="guarantorRelationship" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="e.g. Sibling, Colleague">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Guarantor Address *</label>
                                        <textarea name="guarantorAddress" rows="2" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent resize-none" placeholder="Guarantor's Residential Address"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Investment Fields -->
                        <div id="fields-Investment" class="dynamic-fields hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Investment Amount (₦) *</label>
                                <input type="number" name="investAmount" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="e.g. 100000">
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Investment Plan *</label>
                                <select name="investPlan" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent bg-white">
                                    <option value="Gold (6 Months)">Gold (6 Months - 10% ROI)</option>
                                    <option value="Platinum (1 Year)">Platinum (1 Year - 25% ROI)</option>
                                </select>
                            </div>
                            <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                                <h4 class="font-semibold text-gray-800 mb-4">Next of Kin Details</h4>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Full Name *</label>
                                        <input type="text" name="nokName" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="Next of Kin Name">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number *</label>
                                        <input type="tel" name="nokPhone" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="Next of Kin Phone">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Relationship *</label>
                                        <input type="text" name="nokRelationship" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent" placeholder="Relationship">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Forex Fields -->
                        <div id="fields-Forex" class="dynamic-fields hidden">
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Experience Level *</label>
                                <select name="forexExperience" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent bg-white">
                                    <option value="Beginner">Beginner (No experience)</option>
                                    <option value="Intermediate">Intermediate (Some trading knowledge)</option>
                                    <option value="Advanced">Advanced (Want to refine strategy)</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Preferred Class Type</label>
                                <select name="classType" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent bg-white">
                                    <option value="Online">Online via Zoom</option>
                                    <option value="Physical">Physical Class (Ibadan)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Trading Goals / Expectations</label>
                                <textarea name="forexGoals" rows="2" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-accent resize-none" placeholder="What do you hope to achieve?"></textarea>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-semibold transition-all shadow-lg">
                        <i class="fas fa-paper-plane mr-2"></i>Submit Application
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-500 text-sm">&copy; 2026 E-Adem Global Company Limited. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const typeOptions = document.querySelectorAll('.type-option');
            const hiddenTypeInput = document.getElementById('application-type');
            const dynamicFields = document.querySelectorAll('.dynamic-fields');

            typeOptions.forEach(option => {
                option.addEventListener('click', () => {
                    typeOptions.forEach(opt => {
                        opt.classList.remove('active', 'border-accent', 'bg-accent', 'text-white');
                        opt.classList.add('border-gray-200');
                        opt.querySelector('strong').classList.add('text-gray-600');
                        opt.querySelector('strong').classList.remove('text-white');
                        const icon = opt.querySelector('i');
                        if (icon) icon.classList.add('text-gray-600');
                    });
                    
                    option.classList.add('active', 'border-accent', 'bg-accent', 'text-white');
                    option.classList.remove('border-gray-200');
                    option.querySelector('strong').classList.remove('text-gray-600');
                    option.querySelector('strong').classList.add('text-white');
                    const icon = option.querySelector('i');
                    if (icon) icon.classList.remove('text-gray-600');
                    
                    const selectedType = option.dataset.value;
                    hiddenTypeInput.value = selectedType;

                    dynamicFields.forEach(field => {
                        field.classList.add('hidden');
                        if (field.id === `fields-${selectedType}`) {
                            field.classList.remove('hidden');
                        }
                    });
                });
            });

            const form = document.getElementById('unified-application-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                
                const details = {};
                if (data.type === 'Loan') {
                    details.amount = data.loanAmount;
                    details.duration = data.loanDuration;
                    details.purpose = data.loanPurpose;
                } else if (data.type === 'Investment') {
                    details.amount = data.investAmount;
                    details.plan = data.investPlan;
                } else if (data.type === 'Forex') {
                    details.experienceLevel = data.forexExperience;
                    details.classType = data.classType;
                }

                const payload = {
                    fullName: data.fullName,
                    email: data.email,
                    phone: data.phone,
                    type: data.type,
                    details: details
                };

                try {
                    const response = await fetch('/api/apply', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();

                    if (response.ok) {
                        alert('Application Submitted Successfully! We will contact you shortly.');
                        window.location.href = 'dashboard.html';
                    } else {
                        alert(`Error: ${result.message}`);
                    }
                } catch (err) {
                    console.error('Submission error:', err);
                    alert('An error occurred. Please try again.');
                }
            });
        });
    </script>
</body>
</html>
