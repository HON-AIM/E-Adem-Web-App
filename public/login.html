<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Login | Access Your E-Adem Global Account</title>
    <meta name="title" content="Login | Access Your E-Adem Global Account">
    <meta name="description" content="Sign in to your E-Adem Global account to manage your loans, investments, and wallet. Quick and secure access to your financial dashboard.">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://eademglobal.com/login.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://eademglobal.com/login.html">
    <meta property="og:title" content="Login | Access Your E-Adem Global Account">
    <meta property="og:description" content="Sign in to your E-Adem Global account to manage your loans, investments, and wallet.">
    <meta property="og:site_name" content="E-Adem Global">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f172a',
                        secondary: '#1e293b',
                        accent: '#3b82f6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary via-secondary to-primary p-4">
    <!-- Decorative Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-accent/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html">
                <img src="./images/logo.png" alt="E-Adem Logo" class="h-20 mx-auto mb-4">
            </a>
        </div>

        <!-- Login Card -->
        <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white/10">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-white mb-2">Welcome Back</h2>
                <p class="text-gray-300">Enter your credentials to access your account</p>
            </div>

            <form id="login-form" class="space-y-6">
                <!-- Email -->
                <div class="relative">
                    <input type="email" id="email" class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all" placeholder=" " required>
                    <label for="email" class="absolute left-5 top-4 text-gray-400 pointer-events-none transition-all duration-200">
                        <i class="fas fa-envelope mr-2"></i>Email Address
                    </label>
                </div>

                <!-- Password -->
                <div class="relative">
                    <input type="password" id="password" class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all pr-12" placeholder=" " required>
                    <label for="password" class="absolute left-5 top-4 text-gray-400 pointer-events-none transition-all duration-200">
                        <i class="fas fa-lock mr-2"></i>Password
                    </label>
                    <button type="button" class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                        <i class="far fa-eye"></i>
                    </button>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-4 bg-accent hover:bg-blue-600 text-white font-semibold rounded-xl transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-[1.02] active:scale-[0.98]">
                    <i class="fas fa-sign-in-alt mr-2"></i>Sign In
                </button>
            </form>

            <!-- Links -->
            <div class="mt-8 text-center space-y-3">
                <p class="text-gray-300">
                    Don't have an account? 
                    <a href="register.html" class="text-accent hover:text-blue-400 font-semibold transition-colors">Register here</a>
                </p>
                <a href="forgot-password.html" class="block text-gray-400 hover:text-accent transition-colors text-sm">
                    <i class="fas fa-key mr-1"></i>Forgot Password?
                </a>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="auth-v2.js"></script>
</body>
</html>
